<header
  class="shrink-0 border-b-2 border-[#c9253b] bg-[#151216] pt-[env(safe-area-inset-top)] text-white"
>
  <div
    class="relative mx-auto flex min-h-20 max-w-[1000px] items-center justify-between gap-3 px-3 py-2 sm:px-6"
  >
    @if (user()) {
      <app-team-selector class="min-w-0 flex-1 sm:max-w-sm"></app-team-selector>
    } @else {
      <a routerLink="/games" class="flex items-center gap-3 text-lg font-extrabold tracking-tight">
        <span
          class="grid size-10 place-items-center rounded-xl border border-accent/30 bg-accent/10 text-accent"
          aria-hidden="true"
        >
          <svg
            class="size-6"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          >
            <rect x="3" y="3" width="18" height="18" rx="4" />
            <path d="M12 3v18M3 8h4v8H3m18-8h-4v8h4" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </span>
        <span>Voetbal<span class="text-accent">App</span></span>
      </a>
    }
    @if (user(); as u) {
      <button
        #accountButton
        type="button"
        aria-controls="account-panel"
        class="size-11 shrink-0 rounded-full border border-accent/40 bg-[#292e36] font-bold text-white transition-colors hover:bg-[#37323e]"
        (click)="toggleMenu()"
        [attr.aria-expanded]="mobileOpen()"
        aria-label="Accountmenu"
      >
        {{ (u.displayName || 'V').charAt(0) }}
      </button>
      @if (mobileOpen()) {
        <div
          #accountPanel
          id="account-panel"
          aria-label="Profiel"
          class="absolute right-5 top-[calc(50%+20px)] z-[60] mt-2 w-60 max-w-[calc(100vw-40px)] overflow-hidden break-words rounded-xl border border-accent/40 bg-surface p-1 text-ink shadow-lg"
        >
          <div class="border-b border-line px-3 py-2.5">
            <strong class="block text-sm font-semibold">{{ u.displayName }}</strong>
            <small class="mt-1 block text-xs leading-relaxed text-muted">{{ u.email }}</small>
          </div>
          <button
            class="mt-1 flex min-h-11 w-full items-center rounded-lg px-3 py-2 text-left text-sm font-medium text-accent transition-colors hover:bg-accent/15 focus-visible:bg-accent/15"
            (click)="logout(); closeMenu()"
          >
            Uitloggen
          </button>
        </div>
      }
    }
  </div>
</header>
@if (user()) {
  <nav
    class="fixed inset-x-0 bottom-0 z-40 flex h-[calc(64px+env(safe-area-inset-bottom))] shrink-0 justify-around sm:static sm:h-auto border-t border-line bg-[#151216] px-3 pb-[calc(6px+env(safe-area-inset-bottom))] pt-1 sm:order-none sm:justify-center sm:gap-10 sm:border-b sm:border-t-0 [&_a]:flex [&_a]:min-h-12 [&_a]:flex-1 [&_a]:flex-col [&_a]:items-center [&_a]:justify-center [&_a]:gap-1 [&_a]:py-2 [&_a]:text-xs [&_a]:font-bold [&_a]:text-muted sm:[&_a]:flex-none sm:[&_a]:flex-row sm:[&_a]:gap-2 sm:[&_a]:text-sm [&_svg]:size-[22px] [&_a[aria-current=page]]:text-accent [&_a[aria-current=page]_svg]:rounded [&_a[aria-current=page]_svg]:bg-[#4a1b29]"
    aria-label="Hoofdnavigatie"
  >
    <a
      routerLink="/games"
      routerLinkActive="!text-accent"
      ariaCurrentWhenActive="page"
      (click)="closeMenu()"
      ><svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        aria-hidden="true"
      >
        <rect x="4" y="5" width="16" height="16" rx="3" />
        <path d="M8 3v4m8-4v4M4 11h16m-11 5h6" /></svg
      ><span>Wedstrijden</span></a
    >
    <a
      routerLink="/leaderboard"
      routerLinkActive="!text-accent"
      ariaCurrentWhenActive="page"
      (click)="closeMenu()"
      ><svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        aria-hidden="true"
      >
        <path
          d="M8 3h8v6a4 4 0 0 1-8 0V3Zm0 2H4v3a4 4 0 0 0 4 4m8-7h4v3a4 4 0 0 1-4 4m-4 1v5m-4 3h8m-6-3h4"
        /></svg
      ><span>Statistieken</span></a
    >
    <a
      routerLink="/teams"
      routerLinkActive="!text-accent"
      ariaCurrentWhenActive="page"
      (click)="closeMenu()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        aria-hidden="true"
      >
        <path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z" />
        <path d="m8.5 11.5 2.5 2.5 4.5-5" /></svg
      ><span>Teams</span>
    </a>
    @if (admin.isAdmin()) {
      <a
        routerLink="/seasons"
        routerLinkActive="!text-accent"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          aria-hidden="true"
        >
          <rect x="4" y="4" width="6" height="6" rx="1.5" />
          <rect x="14" y="4" width="6" height="6" rx="1.5" />
          <rect x="4" y="14" width="6" height="6" rx="1.5" />
          <path d="M17 14v6m-3-3h6" /></svg
        ><span>Beheer</span></a
      >
    }
  </nav>
}
