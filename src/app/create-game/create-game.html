<div class="max-w-2xl mx-auto">
  <h2 class="text-xl font-bold text-white mb-4">Nieuwe wedstrijd</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="bg-white rounded shadow p-4 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Tegenstander</label>
      <input type="text" formControlName="opponent" class="w-full border rounded px-3 py-2" placeholder="CTO '70 vv 22" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Datum</label>
      <input type="date" formControlName="date" class="w-full border rounded px-3 py-2" />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Score Thuis Team</label>
        <input type="number" formControlName="scoreTeam" class="w-full border rounded px-3 py-2" min="0" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Score Tegenstander</label>
        <input type="number" formControlName="scoreOpponent" class="w-full border rounded px-3 py-2" min="0" />
      </div>
    </div>

    <div>
      <div class="flex items-center justify-between mb-2">
        <label class="block text-sm font-medium text-gray-700">Gebeurtenissen (Goals/Assists)</label>
        <button type="button" (click)="addEvent()" class="text-sm bg-gray-100 hover:bg-gray-200 border rounded px-2 py-1">+ Voeg event toe</button>
      </div>

      <div formArrayName="events" class="space-y-2">
        <div *ngFor="let ctrl of events.controls; let i = index" [formGroupName]="i" class="grid grid-cols-12 gap-2 items-center">
          <div class="col-span-7">
            <select formControlName="playerId" class="w-full border rounded px-3 py-2">
              <option value="">Selecteer speler</option>
              <option *ngFor="let p of (players$ | async)" [value]="p.id">{{ p.number }} - {{ p.name }}</option>
            </select>
          </div>
          <div class="col-span-4">
            <select formControlName="type" class="w-full border rounded px-3 py-2">
              <option value="goal">Goal</option>
              <option value="assist">Assist</option>
            </select>
          </div>
          <div class="col-span-1 text-right">
            <button type="button" (click)="removeEvent(i)" class="text-red-600 hover:underline" title="Verwijder">&times;</button>
          </div>
        </div>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2">
      <a routerLink="/games" class="px-4 py-2 border rounded">Annuleren</a>
      <button type="submit" class="bg-red-600 hover:bg-red-500 text-white font-semibold px-4 py-2 rounded">Opslaan</button>
    </div>
  </form>
</div>
