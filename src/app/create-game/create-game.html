<div class="max-w-2xl mx-auto px-2 sm:px-0">
  <h2 class="text-xl font-bold text-white mb-4">Nieuwe wedstrijd</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="bg-white border-4 border-red-600 rounded shadow p-4 space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Tegenstander</label>
      <input type="text" formControlName="opponent" class="w-full border rounded px-4 py-3 text-base" placeholder="CTO '70 vv 22" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Datum</label>
      <input type="date" formControlName="date" class="w-full border rounded px-4 py-3 text-base" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Score Thuis Team</label>
        <input type="number" formControlName="scoreTeam" class="w-full border rounded px-4 py-3 text-base" min="0" inputmode="numeric" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Score Tegenstander</label>
        <input type="number" formControlName="scoreOpponent" class="w-full border rounded px-4 py-3 text-base" min="0" inputmode="numeric" />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Spelers die speelden</label>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-72 overflow-auto pr-1">
        @for (p of (players() || []); track p.id) {
          <label class="flex items-center gap-3 p-2 border rounded cursor-pointer active:bg-gray-50">
            <input type="checkbox"
                   class="h-5 w-5"
                   [checked]="isPlayerSelected(p.id!)"
                   (change)="onTogglePlayer(p.id!, $any($event.target).checked)" />
            <span class="text-sm">{{ p.number }} - {{ p.name }}</span>
          </label>
        }
      </div>
      <p class="text-xs text-gray-500 mt-1">Selecteer de spelers die hebben meegedaan.</p>
    </div>

    <div>
      <div class="flex items-center justify-between mb-2">
        <label class="block text-sm font-medium text-gray-700">Gebeurtenissen (Goals/Assists)</label>
        <button type="button" (click)="addEvent()" class="text-sm bg-gray-100 hover:bg-gray-200 border rounded px-3 py-2">+ Voeg event toe</button>
      </div>

      <div formArrayName="events" class="space-y-2">
        @for (ctrl of events.controls; let i = $index; track i) {
          <div [formGroupName]="i" class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center">
            <div class="sm:col-span-7">
              <select formControlName="playerId" class="w-full border rounded px-4 py-3 text-base">
                <option value="">Selecteer speler</option>
                @for (p of (players() || []); track p.id) {
                  <option [value]="p.id">{{ p.number }} - {{ p.name }}</option>
                }
              </select>
            </div>
            <div class="sm:col-span-4">
              <select formControlName="type" class="w-full border rounded px-4 py-3 text-base">
                <option value="goal">Goal</option>
                <option value="assist">Assist</option>
              </select>
            </div>
            <div class="sm:col-span-1 sm:text-right">
              <button type="button" (click)="removeEvent(i)" class="text-red-600 hover:underline px-3 py-2">Verwijder</button>
            </div>
          </div>
        }
      </div>
    </div>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-end gap-2">
      <a routerLink="/games" class="px-4 py-3 border rounded text-center w-full sm:w-auto">Annuleren</a>
      <button type="submit" class="bg-red-600 hover:bg-red-500 text-white font-semibold px-4 py-3 rounded w-full sm:w-auto">Opslaan</button>
    </div>
  </form>
</div>
