<div class="max-w-2xl mx-auto px-2 sm:px-0">
  <h2 class="text-xl font-bold text-white mb-4">Nieuwe wedstrijd</h2>

  <form (ngSubmit)="submit()" [formGroup]="form"
        class="bg-white border-4 border-red-600 rounded shadow p-2 pl-3 pt-6 space-y-4 sticky top-2 sm:top-4 sm:mb-16">
    <div class="max-h-[calc(100vh-20rem)] overflow-y-auto pr-2">
      <div class="mb-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Tegenstander</label>
        <input class="w-full border rounded px-4 py-3 text-base" formControlName="opponent" placeholder="CTO '70 vv 22"
               type="text"/>
      </div>

      <div class="mb-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Datum</label>
        <input class="w-full border rounded px-4 py-3 text-base" formControlName="date" type="date"/>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-2">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Score Thuis Team</label>
          <input class="w-full border rounded px-4 py-3 text-base" formControlName="scoreTeam" inputmode="numeric"
                 min="0"
                 type="number"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Score Tegenstander</label>
          <input class="w-full border rounded px-4 py-3 text-base" formControlName="scoreOpponent" inputmode="numeric"
                 min="0"
                 type="number"/>
        </div>
      </div>

      <div class="mb-2">
        <label class="block text-sm font-medium text-gray-700 mb-2">Spelers die speelden</label>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 overflow-auto pr-1">
          @for (p of (players() || []); track p.id) {
            <label class="flex items-center gap-3 p-2 border rounded cursor-pointer active:bg-gray-50">
              <input type="checkbox"
                     class="h-5 w-5"
                     [checked]="isPlayerSelected(p.id!)"
                     (change)="onTogglePlayer(p.id!, $any($event.target).checked)"/>
              <span class="text-sm">{{ p.number }} - {{ p.name }}</span>
            </label>
          }
        </div>
        <p class="text-xs text-gray-500 mt-1">Selecteer de spelers die hebben meegedaan.</p>
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-sm font-medium text-gray-700">Spelers (Goals/Assists)</label>
          <button (click)="addEvent()" class="text-sm bg-gray-100 hover:bg-gray-200 border rounded px-3 py-2"
                  type="button">Voeg Goals/Assist Toe
          </button>
        </div>

        <div class="space-y-2" formArrayName="events">
          @for (ctrl of events.controls; let i = $index; track i) {
            <div [formGroupName]="i" class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center">
              <div class="sm:col-span-7">
                <select formControlName="playerId" class="w-full border rounded px-4 py-3 text-base">
                  <option value="">Selecteer speler</option>
                  @for (p of (players() || []); track p.id) {
                    <option [value]="p.id">{{ p.number }} - {{ p.name }}</option>
                  }
                </select>
              </div>
              <div class="sm:col-span-4">
                <select formControlName="type" class="w-full border rounded px-4 py-3 text-base">
                  <option value="goal">Goal</option>
                  <option value="assist">Assist</option>
                </select>
              </div>
              <div class="sm:col-span-1 sm:text-right">
                <button type="button" (click)="removeEvent(i)" class="text-red-600 hover:underline px-3 py-2">Verwijder
                </button>
              </div>
            </div>
          }
        </div>
      </div>
    </div>

    <div
      class="sticky bottom-0 left-0 right-0 bg-white pt-2 border-t z-20 flex flex-col sm:flex-row items-stretch sm:items-center justify-end gap-2">
      <a class="px-3 py-2 text-sm border rounded text-center w-full sm:w-auto" routerLink="/games">Annuleren</a>
      <button class="bg-red-600 hover:bg-red-500 text-white font-semibold px-3 py-2 text-sm rounded w-full sm:w-auto"
              type="submit">Opslaan
      </button>
    </div>
  </form>
</div>
