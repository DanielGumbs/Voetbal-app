@if (user$ | async) {
  <header class="flex items-center justify-between gap-3">
    <h1 class="text-xl font-semibold">⚽ Zaal Ballie App</h1>
    <app-login></app-login>
  </header>
  <hr class="my-4">
  <app-game-list></app-game-list>
} @else {
  <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-200 to-indigo-300 font-semibold p-6">
    <div class="bg-white border-4 border-blue-500 rounded-2xl p-7 sm:p-8 shadow-xl w-full max-w-md text-center">
      <h1 class="text-2xl font-bold mb-4">⚽ Zaal Ballie App</h1>
      <p class="text-gray-600 mb-4 text-lg">Welkom! Log in om verder te gaan.</p>
      <app-login></app-login>
    </div>
  </div>
}
