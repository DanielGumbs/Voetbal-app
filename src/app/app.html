<div class="min-h-screen bg-gradient-to-br from-neutral-900 via-neutral-800 to-neutral-900">
<app-navbar></app-navbar>

@if (user$ | async) {
  <main class="max-w-6xl mx-auto px-4 py-4">
    <app-game-list></app-game-list>
  </main>
} @else {
  <div class="min-h-[calc(100vh-5rem)] flex items-center justify-center bg-gradient-to-br from-neutral-900 via-neutral-800 to-neutral-900 text-white p-6 overflow-hidden">
    <div class="bg-white text-gray-900 border-4 border-red-600 rounded-2xl p-7 shadow-xl w-full max-w-md text-center mb-16">
      <div class="flex items-center justify-center gap-4 mb-3">
        <img src="/logo/vedette-logo.jpg" alt="Club logo" class="h-20 w-auto border-2 border-red-600 p-1 ring-1 ring-gray-200 rounded" />
        <div class="text-left leading-tight">
          <h1 class="text-2xl font-extrabold mb-1">ZVV Vedette</h1>
          <p class="text-[12px] uppercase tracking-wider text-gray-400 font-bold">De Remise</p>
        </div>
      </div>
      <p class="text-gray-700 mb-4 text-lg">Welkom! Log in om verder te gaan.</p>
      <app-login></app-login>
    </div>
  </div>
}
</div>
