<app-navbar></app-navbar>

@if (user$ | async) {
  <main class="max-w-6xl mx-auto px-4 py-4">
    <app-game-list></app-game-list>
  </main>
} @else {
  <!-- Public landing with brand colors matching the logo -->
  <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-neutral-900 via-neutral-800 to-neutral-900 text-white p-6">
    <div class="bg-white text-gray-900 border-4 border-red-600 rounded-2xl p-7 sm:p-8 shadow-xl w-full max-w-md text-center">
      <div class="flex items-center justify-center gap-3 mb-3">
        <img src="./logo/vedette-logo.jpg" alt="Club logo" class="h-12 w-auto bg-white p-1 ring-1 ring-gray-200 rounded" />
        <div class="text-left leading-tight">
          <h1 class="text-2xl font-extrabold">ZVV Vedette</h1>
          <p class="text-[11px] uppercase tracking-wider text-gray-500">De Remise</p>
        </div>
      </div>
      <p class="text-gray-700 mb-4 text-lg">Welkom! Log in om verder te gaan.</p>
      <app-login></app-login>
    </div>
  </div>
}
