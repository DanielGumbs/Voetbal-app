<div class="flex h-dvh min-h-0 flex-col overflow-hidden">
  @if (isTestEnvironment) {
    <div
      class="shrink-0 bg-amber-300 px-3 py-1 text-center text-xs font-semibold text-black"
      role="status"
    >
      Testomgeving · aparte testdata
    </div>
  }
  <app-navbar></app-navbar>
  @if (user()) {
    <main
      class="mx-auto mb-[calc(64px+env(safe-area-inset-bottom))] flex min-h-0 w-full max-w-[960px] flex-1 flex-col overflow-hidden px-3 py-3 sm:mb-0 sm:px-6 sm:py-5 [&>router-outlet]:hidden"
    >
      <router-outlet></router-outlet>
    </main>
  } @else {
    <main
      class="min-h-0 flex-1 overflow-y-auto overflow-x-hidden overscroll-contain [scrollbar-width:thin] [scrollbar-color:#79323e_#201d23] mx-auto w-full max-w-[440px] px-7 py-12 text-center [&_h1]:text-[44px] [&_h1]:font-extrabold [&_h1]:leading-tight"
    >
      <div
        class="[&_img]:mx-auto [&_img]:mb-8 [&_img]:h-[154px] [&_img]:w-[100px] [&_img]:rounded-xl [&_img]:border-2 [&_img]:border-[#e63649] [&_img]:bg-white [&_img]:object-contain [&_img]:p-1"
      >
        <img src="/logo/vedette-logo.jpg" alt="ZVV Vedette clublogo" />
      </div>
      <p class="mb-2 text-[10px] font-extrabold tracking-[2px] text-accent">
        ZVV VEDETTE · DE REMISE
      </p>
      <h1>Jouw team.<br />Elke wedstrijd.</h1>
      <p class="mb-7 mt-5 leading-relaxed text-muted">
        Alle wedstrijden, goals en assists van je team. Altijd bij de hand.
      </p>
      <app-login></app-login>
      <p class="mt-5 text-xs text-muted">Log in om de club te volgen.</p>
    </main>
  }
</div>
