<div class="flex items-center justify-between mb-4">
  <h2 class="text-xl font-bold text-white">Wedstrijden</h2>
  <a routerLink="/games/new" class="inline-flex items-center gap-2 bg-red-600 hover:bg-red-500 text-white font-semibold px-4 py-2 rounded">
    + Nieuwe wedstrijd
  </a>
</div>


<div class="bg-white rounded shadow divide-y" *ngIf="games$ | async as games; else loading">
  <div class="p-4 text-gray-500" *ngIf="!games.length">Nog geen wedstrijden.</div>
  <div class="p-4" *ngFor="let g of games">
    <div class="flex items-center justify-between">
      <div>
        <div class="font-semibold">{{ g.opponent }}</div>
        <div class="text-sm text-gray-500">{{ g.date | date:'mediumDate' }}</div>
      </div>
      <div class="text-right">
        <div class="text-lg font-bold" *ngIf="g.scoreTeam != null && g.scoreOpponent != null; else noScore">
          {{ g.scoreTeam }} - {{ g.scoreOpponent }}
        </div>
        <ng-template #noScore>
          <div class="text-gray-400">Geen stand</div>
        </ng-template>
        <div class="text-xs text-gray-500">Events: {{ g.events.length || 0 }}</div>
      </div>
    </div>
  </div>
</div>

<ng-template #loading>
  <div class="text-gray-300">Laden...</div>
</ng-template>
