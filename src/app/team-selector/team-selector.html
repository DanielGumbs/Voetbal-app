<button
  #trigger
  type="button"
  class="flex min-h-[54px] w-full touch-manipulation items-center gap-[9px] rounded-xl bg-transparent py-1 pl-1 pr-[7px] text-left text-ink transition-colors duration-[140ms] [-webkit-tap-highlight-color:transparent] hover:bg-white/5 active:bg-white/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent focus-visible:outline-offset-2 motion-reduce:transition-none sm:gap-[11px]"
  aria-controls="team-switcher-panel"
  [attr.aria-expanded]="open()"
  [attr.aria-label]="'Team kiezen. Huidig team: ' + teams.currentTeam().name"
  (click)="open.set(!open())"
>
  <app-team-badge [name]="teams.currentTeam().name" [logoUrl]="teams.currentTeam().logoUrl" />
  <span class="flex min-w-0 flex-1 flex-col gap-0.5 sm:gap-[3px]"
    ><span class="text-[9px] font-bold leading-3 tracking-[1.6px] text-muted">JOUW TEAM</span
    ><strong
      class="text-sm font-extrabold leading-[17px] max-sm:line-clamp-2 max-sm:whitespace-normal max-sm:[overflow-wrap:anywhere] sm:truncate sm:text-[15px] sm:leading-[19px]"
      [title]="teams.currentTeam().name"
      >{{ teams.currentTeam().name }}</strong
    ></span
  >
  <svg
    class="size-[17px] shrink-0 text-muted transition-transform duration-150 motion-reduce:transition-none"
    [class.rotate-180]="open()"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    aria-hidden="true"
  >
    <path d="m6 9 6 6 6-6" />
  </svg>
</button>
@if (open()) {
  <section
    id="team-switcher-panel"
    class="absolute left-0 top-[calc(100%_+_9px)] z-[70] flex max-h-[calc(100dvh_-_112px_-_env(safe-area-inset-top)_-_env(safe-area-inset-bottom))] w-[328px] max-w-[calc(100vw_-_40px)] flex-col overflow-hidden rounded-[17px] border border-[#53404c] bg-[#201d23] p-[7px] shadow-[0_18px_55px_#0009]"
    aria-label="Kies je team"
  >
    <div
      class="flex shrink-0 justify-between gap-3 px-2.5 pb-[13px] pt-[9px] text-[11px] font-bold text-[#b0aeb6]"
    >
      <span>Wissel van team</span><span>{{ teams.teams().length }} teams</span>
    </div>
    <div
      class="flex min-h-0 max-h-[min(340px,52dvh)] flex-col gap-1.5 overflow-y-auto overscroll-contain [scrollbar-width:thin]"
    >
      @for (team of teams.teams(); track team.id) {
        <button
          type="button"
          class="flex min-h-[62px] w-full shrink-0 touch-manipulation items-center gap-[11px] rounded-[11px] bg-transparent px-2.5 py-[9px] text-left text-ink transition-colors duration-[140ms] [-webkit-tap-highlight-color:transparent] hover:bg-white/5 active:bg-white/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent focus-visible:outline-offset-2 aria-pressed:bg-accent/10 aria-pressed:ring-1 aria-pressed:ring-inset aria-pressed:ring-accent/30 motion-reduce:transition-none"
          [attr.aria-pressed]="team.id === teams.currentTeam().id"
          (click)="select(team.id)"
        >
          <app-team-badge
            class="!size-[37px] !rounded-[10px]"
            [name]="team.name"
            [logoUrl]="team.logoUrl"
          />
          <span class="min-w-0 flex-1 text-[13px] font-bold [overflow-wrap:anywhere]">{{
            team.name
          }}</span>
          @if (team.id === teams.currentTeam().id) {
            <svg
              class="size-[18px] shrink-0 text-[#ff7382]"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m5 12 4 4L19 6" />
            </svg>
          }
        </button>
      }
    </div>
    <a
      class="mt-[7px] flex min-h-12 shrink-0 touch-manipulation items-center gap-2.5 rounded-[11px] border-t border-line bg-transparent p-2.5 text-xs font-bold text-[#ff8793] transition-colors duration-[140ms] [-webkit-tap-highlight-color:transparent] hover:bg-white/5 active:bg-white/10 focus-visible:outline focus-visible:outline-2 focus-visible:outline-accent focus-visible:outline-offset-2 motion-reduce:transition-none"
      routerLink="/teams"
      (click)="closeAndRestoreFocus()"
    >
      <svg
        class="size-[18px] shrink-0"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        aria-hidden="true"
      >
        <rect x="3" y="3" width="7" height="7" rx="2" />
        <rect x="14" y="3" width="7" height="7" rx="2" />
        <rect x="3" y="14" width="7" height="7" rx="2" />
        <path d="M17.5 14v7M14 17.5h7" />
      </svg>
      Alle teams bekijken
      <svg
        class="ml-auto size-[18px] shrink-0"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M5 12h14m-6-6 6 6-6 6" />
      </svg>
    </a>
  </section>
}
