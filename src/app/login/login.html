@if (user(); as u) {
  <p>Ingelogd als {{ u.displayName }}</p>
  <button class="mt-5 inline-block font-bold text-accent" (click)="logout()">Uitloggen</button>
} @else {
  <button
    class="inline-flex min-h-11 items-center justify-center rounded-xl bg-accent px-4 py-2 text-sm font-bold text-white"
    (click)="login()"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="M20 12h-8m8 0c0 5-3 8-8 8a8 8 0 1 1 5-14" /></svg
    >Doorgaan met Google
  </button>
}
