@if (user(); as u) {
  <p>Ingelogd als {{ u.displayName }}</p>
  <button
    class="mt-5 inline-flex min-h-11 items-center justify-center rounded-xl border border-line bg-surface px-4 py-2 text-sm font-semibold text-ink transition-colors hover:bg-white/5"
    (click)="logout()"
  >
    Uitloggen
  </button>
} @else {
  <button
    class="inline-flex min-h-11 items-center justify-center gap-2 rounded-xl bg-action px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-action-hover active:bg-action-pressed disabled:pointer-events-none disabled:opacity-50"
    (click)="login()"
    [disabled]="signingIn()"
  >
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      aria-hidden="true"
    >
      <path d="M20 12h-8m8 0c0 5-3 8-8 8a8 8 0 1 1 5-14" /></svg
    >{{ signingIn() ? 'Inloggen…' : 'Doorgaan met Google' }}
  </button>
  @if (error()) {
    <p role="alert" class="mt-3 text-sm text-red-300">{{ error() }}</p>
  }
}
