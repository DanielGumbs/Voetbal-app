@if (user$ | async; as u) {
  <p class="text-sm text-gray-700">Ingelogd als {{ u.displayName }} ({{ u.email }})</p>
  <button class="mt-2 inline-flex items-center gap-2 px-3 py-1.5 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-50 text-sm" (click)="logout()">Logout</button>
} @else {
  <button class="inline-flex items-center justify-center gap-2 text-white bg-blue-600 hover:bg-blue-700 font-semibold rounded-md px-6 py-3 shadow-md active:translate-y-px transition" (click)="login()" aria-label="Login met Google">🔐 Login met Google</button>
}
